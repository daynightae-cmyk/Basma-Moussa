<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
<title id="title">Basma Moussa — Media Universe</title>
<desc id="desc">A cinematic midnight navy and brushed gold editorial banner with a subtle Egyptian-inspired lotus, a microphone soundwave, and elegant typography.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#060A16"/><stop offset=".62" stop-color="#0D152A"/><stop offset="1" stop-color="#16172B"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#92642A"/><stop offset=".28" stop-color="#F5D89B"/><stop offset=".58" stop-color="#C4964F"/><stop offset=".88" stop-color="#FBE5B7"/><stop offset="1" stop-color="#B58237"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#CDA462" stop-opacity=".26"/><stop offset="1" stop-color="#CDA462" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="19" height="19" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#E6BA79" opacity=".14"/></pattern>
  <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<rect width="1400" height="420" fill="url(#bg)"/><rect width="1400" height="420" fill="url(#dots)"/>
